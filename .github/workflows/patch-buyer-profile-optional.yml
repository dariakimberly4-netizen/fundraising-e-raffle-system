name: Patch Buyer Profile Optional

on:
  push:
    paths:
      - '.github/workflows/patch-buyer-profile-optional.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make buyer profiles optional in cached app
        run: |
          python - <<'PY'
          from pathlib import Path

          buyer = Path('buyer.html')
          text = buyer.read_text(encoding='utf-8')
          text = text.replace('./buyer-profiles.js?v=1', './buyer-profiles.js?v=2')
          buyer.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace("const CACHE='fundraising-eraffle-v23';", "const CACHE='fundraising-eraffle-v24';")
          text = text.replace('./buyer-profiles.js?v=1', './buyer-profiles.js?v=2')
          sw.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add buyer.html sw.js
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Make buyer profiles optional in public portal'
            git push
          fi
