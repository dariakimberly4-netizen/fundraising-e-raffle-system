name: Patch Offline Ticket Status Cache
on:
  push:
    paths:
      - '.github/workflows/patch-offline-ticket-status.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update seller offline cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text()
          s=s.replace("const CACHE='fundraising-eraffle-v21';","const CACHE='fundraising-eraffle-v22';")
          s=s.replace("'./seller-number-choice.js?v=1'","'./seller-number-choice.js?v=2'")
          s=s.replace("fetch(e.request,{cache:'no-store'}).catch(()=>caches.match(e.request))","fetch(e.request,{cache:'no-store'}).catch(()=>caches.match(e.request,{ignoreSearch:true}))")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git diff --cached --quiet || git commit -m "Cache offline ticket status checker"
          git push