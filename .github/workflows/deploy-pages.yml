name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare simplest buyer and seller workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('buyer.html')
          if not p.exists():
              raise SystemExit('buyer.html not found')
          s = p.read_text()
          s = re.sub(r'<style id="buyerIntroScreen">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<script id="buyerIntroScreenScript">.*?</script>\s*', '', s, flags=re.S)
          s = re.sub(r'<script id="buyerIntroFirst">.*?</script>\s*', '', s, flags=re.S)
          s = re.sub(r'<script src="\.\/buyer-ticket-design\.js(?:\?v=\d+)?"></script>\s*', '', s, flags=re.S)
          s = re.sub(r'<script src="\.\/buyer-simple-flow\.js(?:\?v=\d+)?"></script>\s*', '', s, flags=re.S)
          css = '<style id="buyerIntroScreen">body:not(.buyer-started) main > :not(#introduction){display:none!important}body:not(.buyer-started) #introduction{min-height:calc(100svh - 94px);display:flex;flex-direction:column;justify-content:center}body:not(.buyer-started) .buyAction{margin-top:20px}@media(max-width:640px){body:not(.buyer-started) #introduction{min-height:calc(100svh - 90px)}}</style>'
          script = '<script id="buyerIntroScreenScript">(function(){if("scrollRestoration" in history)history.scrollRestoration="manual";function resetIntro(){document.body.classList.remove("buyer-started");try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}window.scrollTo(0,0)}function startBuying(e){if(e)e.preventDefault();document.body.classList.add("buyer-started");requestAnimationFrame(function(){var buy=document.getElementById("buy");if(buy)buy.scrollIntoView({behavior:"smooth",block:"start"})})}function init(){resetIntro();var btn=document.querySelector("#introduction .buyAction");if(btn){btn.textContent="BUY RAFFLE TICKET";btn.setAttribute("href","#buy");btn.addEventListener("click",startBuying)}}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init,{once:true});else init();window.addEventListener("pageshow",function(e){if(e.persisted)resetIntro()})})();</script>'
          s = s.replace('</head>', css + script + '</head>', 1)
          s = s.replace('</body>', '<script src="./buyer-ticket-design.js?v=1"></script><script src="./buyer-simple-flow.js?v=1"></script></body>', 1)
          p.write_text(s)

          seller = Path('index.html')
          if seller.exists():
              x = seller.read_text()
              x = re.sub(r'<script src="\.\/seller-simple-flow\.js(?:\?v=\d+)?"></script>\s*', '', x, flags=re.S)
              x = x.replace('</body>', '<script src="./seller-simple-flow.js?v=1"></script></body>', 1)
              seller.write_text(x)

          buyer_demo = Path('buyer-demo.html')
          if buyer_demo.exists():
              x = buyer_demo.read_text()
              x = re.sub(r'<script src="\.\/buyer-demo-role-fix\.js(?:\?v=\d+)?"></script>\s*', '', x, flags=re.S)
              x = x.replace('</body>', '<script src="./buyer-demo-role-fix.js?v=1"></script></body>', 1)
              buyer_demo.write_text(x)

          seller_demo = Path('seller-demo.html')
          if seller_demo.exists():
              x = seller_demo.read_text()
              x = re.sub(r'<script src="\.\/seller-demo-role-fix\.js(?:\?v=\d+)?"></script>\s*', '', x, flags=re.S)
              x = x.replace('</body>', '<script src="./seller-demo-role-fix.js?v=1"></script></body>', 1)
              seller_demo.write_text(x)

          sw = Path('sw.js')
          if sw.exists():
              w = sw.read_text()
              w = re.sub(r"const CACHE='fundraising-eraffle-v\d+';", "const CACHE='fundraising-eraffle-v33';", w, count=1)
              if "'./buyer-ticket-design.js?v=1'" not in w:
                  w = w.replace("'./buyer-offline-workflow.js?v=1',", "'./buyer-offline-workflow.js?v=1','./buyer-ticket-design.js?v=1',", 1)
              if "'./buyer-simple-flow.js?v=1'" not in w:
                  w = w.replace("'./buyer-ticket-design.js?v=1',", "'./buyer-ticket-design.js?v=1','./buyer-simple-flow.js?v=1',", 1)
              if "'./seller-simple-flow.js?v=1'" not in w:
                  w = w.replace("'./seller-offline-workflow.js?v=1',", "'./seller-offline-workflow.js?v=1','./seller-simple-flow.js?v=1',", 1)
              for asset, anchor in [("'./buyer-demo-role-fix.js?v=1'", "'./buyer-simple-flow.js?v=1',"),("'./seller-demo-role-fix.js?v=1'", "'./seller-simple-flow.js?v=1',")]:
                  if asset not in w:
                      w = w.replace(anchor, anchor+asset+',', 1)
              if "url.pathname.endsWith('/buyer-ticket-design.js')" not in w:
                  w = w.replace("url.pathname.endsWith('/buyer-mobile-simple.js')||", "url.pathname.endsWith('/buyer-mobile-simple.js')||url.pathname.endsWith('/buyer-ticket-design.js')||", 1)
              if "url.pathname.endsWith('/buyer-simple-flow.js')" not in w:
                  w = w.replace("url.pathname.endsWith('/buyer-ticket-design.js')||", "url.pathname.endsWith('/buyer-ticket-design.js')||url.pathname.endsWith('/buyer-simple-flow.js')||", 1)
              if "url.pathname.endsWith('/seller-simple-flow.js')" not in w:
                  w = w.replace("url.pathname.endsWith('/seller-friendly.js')||", "url.pathname.endsWith('/seller-friendly.js')||url.pathname.endsWith('/seller-simple-flow.js')||", 1)
              sw.write_text(w)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
