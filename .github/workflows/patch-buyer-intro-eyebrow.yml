name: Patch Buyer Intro Eyebrow

on:
  push:
    paths:
      - '.github/workflows/patch-buyer-intro-eyebrow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enlarge and center buyer introduction heading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('buyer.html')
          s=p.read_text()
          pattern=r'\.eyebrow\{font-size:10px;letter-spacing:\.14em;text-transform:uppercase;color:var\(--green\);font-weight:950\}'
          repl='.eyebrow{display:block;width:100%;text-align:center;font-size:13px;line-height:1.4;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:950;margin-bottom:10px}'
          s2,n=re.subn(pattern,repl,s,count=1)
          if n!=1:
              raise SystemExit('Expected eyebrow style not found')
          p.write_text(s2)
          PY
      - name: Commit buyer introduction heading update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buyer.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Enlarge and center buyer introduction heading"
          git push origin HEAD:main