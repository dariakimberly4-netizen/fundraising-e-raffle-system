name: Patch Buyer Introduction V2

on:
  push:
    paths:
      - '.github/workflows/patch-buyer-introduction-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Redesign buyer introduction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('buyer.html')
          s=p.read_text()

          css_marker='.introBenefit span{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:4px}.card'
          css_new='''.introBenefit span{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:4px}.introV2{background:linear-gradient(145deg,#ffffff 0%,#f7fbf4 62%,#fffaf0 100%);border:1px solid #dfe8d9;border-radius:28px;box-shadow:0 16px 42px rgba(36,107,45,.10);overflow:hidden;position:relative}.introV2:before{content:"";display:block;height:7px;background:linear-gradient(90deg,var(--green),var(--leaf),var(--gold),var(--red))}.introV2Inner{padding:30px 28px 26px;text-align:center}.introV2Badge{display:inline-flex;align-items:center;justify-content:center;padding:7px 11px;border-radius:999px;background:#eef7ea;color:var(--green);font-size:10px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.introV2 h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,7vw,54px);line-height:.98;color:var(--red);margin:14px auto 10px;max-width:700px}.introV2Tag{font-family:Georgia,"Times New Roman",serif;color:var(--green);font-size:18px;font-weight:800;margin:0 auto 14px;max-width:650px}.introV2Text{max-width:720px;margin:0 auto;color:#4b5b47;line-height:1.65;font-size:14px}.introV2Trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:22px auto 0;max-width:760px;border-top:1px solid #e0e8db;border-bottom:1px solid #e0e8db}.introV2Trust div{padding:15px 14px}.introV2Trust div+div{border-left:1px solid #e0e8db}.introV2Trust b{display:block;color:var(--green);font-size:13px}.introV2Trust span{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:4px}.introV2Event{margin:20px auto 0;max-width:760px;background:#fff9e8;border:1px solid #f0dfaa;border-radius:17px;padding:14px 16px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;color:#6c551a;font-size:12px;font-weight:850}.introV2Event i{font-style:normal;color:var(--gold)}.introV2 .actions{justify-content:center;margin-top:18px}.introV2 .btn{min-width:180px}.card'''
          if css_marker not in s:
              raise SystemExit('Introduction CSS marker not found')
          s=s.replace(css_marker,css_new,1)

          mobile='@media(max-width:780px){.buyerPortalLabel{display:none}.buyerCenterTitle{font-size:15px;max-width:48vw;white-space:normal}.menuBtn{display:inline-flex}'
          mobile_new='@media(max-width:780px){.buyerPortalLabel{display:none}.buyerCenterTitle{font-size:15px;max-width:48vw;white-space:normal}.introV2Inner{padding:25px 18px 22px}.introV2Trust{grid-template-columns:1fr}.introV2Trust div+div{border-left:0;border-top:1px solid #e0e8db}.introV2Event{display:grid;gap:4px}.introV2 .actions .btn{min-width:0}.menuBtn{display:inline-flex}'
          if mobile not in s:
              raise SystemExit('Mobile CSS marker not found')
          s=s.replace(mobile,mobile_new,1)

          start=s.index('<section id="introduction" class="view active">')
          end=s.index('</section>',start)+len('</section>')
          new_section='''<section id="introduction" class="view active">
  <div class="introV2">
    <div class="introV2Inner">
      <div class="introV2Badge">Parkinson’s Disease Warriors Philippines • Fundraising E‑Raffle</div>
      <h2>GET TOGETHER 2027</h2>
      <p class="introV2Tag">Support the cause. Keep every ticket in your hands.</p>
      <p class="introV2Text">This fundraising raffle is open to supporters and is not limited to event attendees. Buy one ticket or several. After seller confirmation, you receive exactly the number of official e‑tickets you paid for.</p>
      <div class="introV2Trust">
        <div><b>One Control No.</b><span>One transaction reference for your complete purchase.</span></div>
        <div><b>Exact E‑Ticket Count</b><span>Buy 5 tickets and receive exactly 5 official e‑tickets.</span></div>
        <div><b>Verified Individually</b><span>Every e‑ticket has its own Ticket No. and Verification Code.</span></div>
      </div>
      <div class="introV2Event"><span>January 16, 2027</span><i>•</i><span>9:00 AM–1:00 PM</span><i>•</i><span>St. Luke’s Medical Center – Quezon City</span></div>
      <div class="actions"><a class="btn red" href="#buy">BUY RAFFLE TICKETS</a><a class="btn secondary" href="#request">Check My Request</a></div>
    </div>
  </div>
</section>'''
          s=s[:start]+new_section+s[end:]
          p.write_text(s)
          PY
      - name: Commit buyer introduction redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buyer.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Redesign buyer introduction with clean campaign layout"
          git push origin HEAD:main
