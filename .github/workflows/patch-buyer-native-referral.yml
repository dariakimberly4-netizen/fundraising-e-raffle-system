name: Patch Buyer Native Referral

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-buyer-native-referral.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make referral controls fully native and tappable
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('buyer.html')
          s=p.read_text()

          # Stop the friendly script from rebuilding/moving the form controls.
          s=re.sub(r'<script src="\.\/buyer-friendly\.js\?v=\d+" defer></script>', '', s)

          # Use a plain text/input control for referral source instead of a mobile select.
          s=re.sub(
            r'<label>Where did you hear about the raffle\?<select id="referralSource">.*?</select></label>',
            '<label>Where did you hear about the raffle?<input id="referralSource" autocomplete="off" placeholder="Example: Facebook, Messenger, Friend / Family, PD Warriors Member"></label>',
            s,
            count=1,
            flags=re.S
          )

          # Add a direct mobile tap-safety layer for the two referral controls only.
          marker='</head>'
          style='''<style id="nativeReferralTapFix">\n#referredBy,#referralSource{pointer-events:auto!important;touch-action:manipulation!important;position:relative!important;z-index:20!important;-webkit-user-select:text!important;user-select:text!important;opacity:1!important;visibility:visible!important}\n#referredBy:disabled,#referralSource:disabled{pointer-events:auto!important;opacity:1!important}\nlabel:has(#referredBy),label:has(#referralSource){pointer-events:auto!important;position:relative!important;z-index:20!important}\n</style>'''
          if 'id="nativeReferralTapFix"' not in s:
            s=s.replace(marker,style+marker,1)

          p.write_text(s)

          # Force a fresh offline shell without touching the approved mobile-height code.
          sw=Path('sw.js')
          w=sw.read_text()
          w=re.sub(r"const CACHE='fundraising-eraffle-v(\d+)'",lambda m:f"const CACHE='fundraising-eraffle-v{int(m.group(1))+1}'",w,count=1)
          sw.write_text(w)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buyer.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Use native tappable buyer referral controls"
          git push
