<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b1f70">
<title>GET TOGETHER 2027 — Verify E‑Raffle Ticket</title>
<style>
:root{--ink:#201728;--muted:#72687b;--purple:#4b1f70;--purple2:#6d38a0;--line:#e7dfed;--green:#187650;--red:#ad3039;--amber:#9b6519;--shadow:0 12px 34px rgba(61,31,81,.10)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fbf9fc,#f1ecf6);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px;min-height:100vh}.head{display:flex;align-items:center;gap:11px;margin-bottom:15px}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;font-weight:900}.head h1{font-size:20px;margin:0}.head small{display:block;color:var(--muted);margin-top:2px}.hero{background:linear-gradient(135deg,#35114f,#6c3498);color:#fff;padding:24px;border-radius:24px;box-shadow:var(--shadow)}.hero h2{font-size:31px;line-height:1.05;margin:6px 0 8px}.hero p{margin:0;color:#efe7f4;line-height:1.45}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(60,32,74,.06);margin-top:14px}.badge{display:inline-flex;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.paid{background:#e5f5ed;color:var(--green)}.pending{background:#fff1da;color:var(--amber)}.void{background:#fde7e9;color:var(--red)}.missing{background:#eee8f1;color:#5c4b65}.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eee8f1}.kv:last-child{border:0}.kv span{color:var(--muted)}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.note{color:var(--muted);font-size:13px;line-height:1.45}.search{display:flex;gap:9px}.search input{flex:1;border:1px solid #dcd2e2;border-radius:13px;padding:12px 13px;font:inherit}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:850;background:var(--purple);color:#fff;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 10px 36px}@media(max-width:640px){.wrap{padding:14px}.hero{padding:22px 20px}.hero h2{font-size:29px}.search{flex-direction:column}.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo">ER</div><div><h1>GET TOGETHER 2027 — Fundraising E‑Raffle</h1><small>Parkinson's Disease Warriors Philippines</small></div></div>
  <div class="hero"><h2>Verify raffle ticket.</h2><p>Check a GET TOGETHER 2027 raffle number or verification code against the official records saved on this device.</p></div>
  <div class="card"><div class="search"><input id="q" placeholder="GT27-00001 or verification code"><button id="verifyBtn" class="btn">Verify</button></div><div id="result" style="margin-top:14px"></div></div>
  <div class="footer">GET TOGETHER 2027 • Fundraising E‑Raffle Ticket Verification</div>
</div>
<script>
const KEY='fundraising_eraffle_v1';let db=null;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function show(){const raw=document.getElementById('q').value.trim().toLowerCase(),box=document.getElementById('result');if(!raw){box.innerHTML='<p class="note">Enter a raffle number or verification code.</p>';return}if(!db||!Array.isArray(db.tickets)){box.innerHTML='<div class="card" style="box-shadow:none"><span class="badge missing">RECORD NOT AVAILABLE</span><p class="note">This device does not have the organizer’s local raffle records. Shared public verification will be available when the online database is connected later.</p></div>';return}const t=db.tickets.find(x=>String(x.number||'').toLowerCase()===raw||String(x.code||'').toLowerCase()===raw);if(!t){box.innerHTML='<div class="card" style="box-shadow:none"><span class="badge void">NOT FOUND</span><p class="note">No GET TOGETHER 2027 raffle ticket in this browser matches that number or verification code.</p></div>';return}const status=t.voided?'void':(t.status||'pending');const eligible=status==='paid'?'YES':'NO';box.innerHTML=`<div class="card" style="box-shadow:none"><span class="badge ${status}">${status.toUpperCase()}</span><h3>${esc(t.number)}</h3><div class="kv"><span>Ticket holder</span><b>${esc(t.buyerName)}</b></div><div class="kv"><span>Verification code</span><b class="code">${esc(t.code)}</b></div><div class="kv"><span>Eligible for draw</span><b>${eligible}</b></div><div class="kv"><span>Ticket value</span><b>₱${Number(t.price||0).toLocaleString('en-PH')}</b></div><div class="kv"><span>Campaign</span><b>GET TOGETHER 2027</b></div></div>`}
document.getElementById('verifyBtn').onclick=show;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')show()});const p=new URLSearchParams(location.search);document.getElementById('q').value=p.get('code')||p.get('ticket')||'';if(document.getElementById('q').value)show();
</script>
</body>
</html>
