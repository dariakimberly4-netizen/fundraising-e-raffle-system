<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#246b2d"><title>Treasurer Demo — GET TOGETHER 2027</title><style>:root{--green:#246b2d;--red:#ee3a16;--gold:#d7a91f;--cream:#fffdf6;--ink:#223022;--muted:#687466;--line:#dfe8d9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffdf6,#f4f8f1);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-family:Georgia,"Times New Roman",serif;font-weight:900;color:var(--green);font-size:18px}.brand small{display:block;font-family:Inter,system-ui,sans-serif;font-size:10px;color:var(--muted);margin-top:4px}.right{display:flex;align-items:center;gap:8px}.who{font-size:11px;font-weight:900;color:var(--green)}button{font:inherit;cursor:pointer}.logout{min-height:38px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;color:var(--red);font-weight:950}main{width:min(100%,760px);margin:0 auto;padding:14px 14px 36px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 8px 22px rgba(36,107,45,.07)}h1,h2{font-family:Georgia,"Times New Roman",serif;color:var(--green)}h1{font-size:25px;margin:0}h2{font-size:24px;margin:0}.notice{border-radius:14px;padding:12px 13px;line-height:1.5;font-size:13px;margin-top:12px}.ok{background:#eaf6e9;color:#246b2d;border:1px solid #cae0c4}.warn{background:#fff7df;color:#7b5b0a;border:1px solid #eadca8}.summary{background:#fbfdf9;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #edf2ea}.kv:last-child{border:0}.kv span{color:var(--muted)}.proof{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fbfdf9}.proof img{display:block;max-width:100%;max-height:420px;margin:10px auto 0;border-radius:12px;border:1px solid var(--line)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{min-height:50px;border:0;border-radius:14px;padding:12px 15px;font-weight:950;flex:1}.green{background:var(--green);color:#fff}.danger{background:#fff1ef;color:#a52d20;border:1px solid #f0d0ca}.small{font-size:11px;color:var(--muted);line-height:1.45}@media(max-width:640px){.kv{flex-direction:column}.actions{flex-direction:column}}</style></head><body><header><div class="brand">Treasurer Demo<small>GET TOGETHER 2027</small></div><div class="right"><span class="who" id="who"></span><button class="logout" id="logout">LOG OUT</button></div></header><main><section class="card"><h1>Payment Verification</h1><div class="notice warn" id="status">Checking buyer request…</div></section><section class="card" id="requestCard" hidden><h2>Buyer Payment Request</h2><div class="summary" id="summary"></div><div class="proof"><b style="color:var(--green)">Payment Proof</b><div class="small" id="proofName"></div><div id="proofPreview"></div></div><div class="actions"><button class="btn danger" id="returnBtn">RETURN FOR REVIEW</button><button class="btn green" id="verifyBtn">MARK PAYMENT RECEIVED</button></div></section></main><script>(function(){const AUTH='gt27_treasurer_auth_v1',NAME='gt27_treasurer_name_v1',TX='gt27_demo_tx_v2',LOG='gt27_demo_seller_activity_v1';if(sessionStorage.getItem(AUTH)!=='1'){location.replace('./treasurer-demo-login.html');return}const $=id=>document.getElementById(id);const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'')||f}catch(e){return f}};const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));$('who').textContent=sessionStorage.getItem(NAME)||'Treasurer';$('logout').onclick=()=>{sessionStorage.removeItem(AUTH);sessionStorage.removeItem(NAME);location.replace('./treasurer-demo-login.html')};function render(){const d=read(TX,null),status=$('status'),card=$('requestCard');if(!d){status.className='notice warn';status.innerHTML='<b>NO REQUEST YET</b><br>Waiting for a buyer to submit payment.';card.hidden=true;return}if(d.status==='issued'||d.status==='payment_verified'){status.className='notice ok';status.innerHTML='<b>PAYMENT RECEIVED / VERIFIED</b><br>Verified by '+esc(d.treasurerVerifiedBy||'Treasurer')+(d.treasurerVerifiedAt?' • '+new Date(d.treasurerVerifiedAt).toLocaleString():'')+'.';card.hidden=true;return}if(d.status==='payment_issue'){status.className='notice warn';status.innerHTML='<b>PAYMENT NEEDS ATTENTION</b><br>'+esc(d.returnReason||'Returned for review.');card.hidden=true;return}status.className='notice warn';status.innerHTML='<b>WAITING FOR TREASURER VERIFICATION</b><br>Confirm that the payment was actually received before staff can issue e-tickets.';card.hidden=false;$('summary').innerHTML='<div class="kv"><span>Request No.</span><b>'+esc(d.requestNo||'—')+'</b></div><div class="kv"><span>Buyer</span><b>'+esc(d.name||'—')+'</b></div><div class="kv"><span>Tickets</span><b>'+esc(d.qty||0)+'</b></div><div class="kv"><span>Total</span><b>₱'+Number(d.total||0).toLocaleString('en-PH')+'</b></div><div class="kv"><span>Payment Method</span><b>'+esc(d.method||'—')+'</b></div><div class="kv"><span>Reference</span><b>'+esc(d.paymentRef||'—')+'</b></div>';$('proofName').textContent=d.proofName||'No filename available';$('proofPreview').innerHTML='';if(d.proofData&&String(d.proofType||'').startsWith('image/'))$('proofPreview').innerHTML='<img src="'+d.proofData+'" alt="Payment proof preview">'}$('verifyBtn').onclick=()=>{const d=read(TX,null);if(!d)return;d.status='payment_verified';d.treasurerVerifiedAt=new Date().toISOString();d.treasurerVerifiedBy=sessionStorage.getItem(NAME)||'Treasurer';d.paymentVerifiedAt=d.treasurerVerifiedAt;save(TX,d);const a=read(LOG,[]);a.unshift({action:'PAYMENT VERIFIED BY TREASURER',requestNo:d.requestNo||'',seller:'treasurer',sellerName:d.treasurerVerifiedBy,at:d.treasurerVerifiedAt});save(LOG,a.slice(0,50));render()};$('returnBtn').onclick=()=>{const reason=prompt('Reason for returning the payment:','Payment not confirmed by Treasurer.');if(reason===null)return;const d=read(TX,null);if(!d)return;d.status='payment_issue';d.returnReason=reason||'Payment needs review.';delete d.treasurerVerifiedAt;delete d.treasurerVerifiedBy;save(TX,d);render()};render();window.addEventListener('focus',render);window.addEventListener('storage',render)})();</script></body></html>
